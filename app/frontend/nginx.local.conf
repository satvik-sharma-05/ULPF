# Local Windows/Docker Desktop variant of nginx.conf.
#
# The shipped nginx.conf proxies to "localhost:8000" because the real
# deployment runs both containers with `network_mode: host` on the airgapped
# Linux VM. Docker Desktop for Windows does not give a container the host's
# actual loopback under `network_mode: host` (confirmed: connection refused),
# so this build instead runs backend+frontend on an ordinary bridge network
# and proxies to the backend by its Compose service name. Mounted over
# /etc/nginx/conf.d/default.conf at runtime by docker-compose.local.yml - the
# image itself (and nginx.conf baked into it) is unchanged, so the .tar built
# for the airgapped VM is unaffected.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolved at request time (Docker's embedded DNS, 127.0.0.11), not at
    # nginx startup - so this container can start and serve the UI even
    # before/without the backend container existing on this network yet.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
