# Serves the built React app and reverse-proxies /api/* to the chatbot
# backend and /analytics-api/* to the analytics backend. The frontend always
# calls relative paths and never needs to know either backend's real address,
# and no CORS headers are needed anywhere in this deployed setup.
#
# Listens on 3000, and proxies to both backends via localhost, not a Docker
# Compose service name: all three containers (this one, chatbot-backend,
# analytics-backend) run with `network_mode: host` (see docker-compose.yml -
# required because the VM's Ollama binds to 127.0.0.1, which only a truly
# host-networked container can reach), and a host-networked container isn't
# attached to any compose-managed bridge network, so service-name DNS
# resolution doesn't exist for it. "localhost" is correct here precisely
# because every container shares the host's network namespace.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://localhost:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Text-to-Cypher/GraphRAG answers can take a while when Ollama is
        # generating - don't cut the proxy off underneath a slow answer.
        proxy_read_timeout 180s;
    }

    # analytics_pipeline runs as its own backend on 8010 with routes under
    # /api/analytics/* - rewritten here so the frontend's own '/api/' prefix
    # stays reserved for the chatbot backend above.
    location /analytics-api/ {
        proxy_pass http://localhost:8010/api/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ingestion_pipeline's control API on 8020 - modes and custom-log uploads.
    location /ingest-api/ {
        proxy_pass http://localhost:8020/api/ingest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A custom-log upload is a whole file, not a form post - the default
        # 1MB body cap would reject anything realistic. Kept in step with the
        # API's own INGEST_MAX_UPLOAD_MB (default 200MB).
        client_max_body_size 200m;
        # Parsing + embedding runs in a background thread, so the request
        # itself returns quickly - but the upload leg still has to finish.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback: any path that isn't a real static file goes to
    # index.html, so client-side routing (if ever added) doesn't 404 on
    # refresh. Harmless no-op for the current single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
