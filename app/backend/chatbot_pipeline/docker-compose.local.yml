# Local Windows/Docker Desktop run of the SAME images built by
# ../build_offline_images.ps1 (chatbot-backend:latest, chatbot-frontend:latest).
#
# docker-compose.yml uses `network_mode: host` because the real target (the
# airgapped Linux VM) needs to reach Ollama on 127.0.0.1 and that only works
# from a truly host-networked container on Linux. Docker Desktop for Windows
# does not extend the container's "localhost" to the Windows host under
# network_mode: host (verified: connection refused), so this file instead:
#   - joins the same bridge network sandbox-neo4j already uses
#     (ingestion-network, started by `docker compose --profile sandbox up -d
#     sandbox-neo4j` in ../ingestion_pipeline), reaching it by service name
#   - reaches the native Windows Ollama via host.docker.internal, which DOES
#     resolve to the Windows host from an ordinary bridge-networked container
#   - publishes 8000/3000 so the browser on the Windows host can reach them
#   - mounts nginx.local.conf over the frontend's baked-in nginx.conf, since
#     that file's proxy_pass target ("localhost:8000") only makes sense under
#     host networking
#
# Usage (from chatbot_pipeline/):
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down
services:
  backend:
    image: chatbot-backend:latest
    container_name: chatbot-backend
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      NEO4J_URI: bolt://sandbox-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sandboxpassword}
      NEO4J_DATABASE: neo4j
      CHATBOT_LLM_PROVIDER: ollama
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:14b
      CHATBOT_TIMEOUT: ${CHATBOT_TIMEOUT:-120}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      NEO4J_VECTOR_INDEX: ${NEO4J_VECTOR_INDEX:-log_embedding_index}
      NEO4J_FULLTEXT_INDEX: ${NEO4J_FULLTEXT_INDEX:-log_message_fulltext}
      CHATBOT_RERANKER_ENABLED: ${CHATBOT_RERANKER_ENABLED:-true}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      CHATBOT_RERANKER_TOP_N: ${CHATBOT_RERANKER_TOP_N:-15}
      CHATBOT_ROUTER_THRESHOLD: ${CHATBOT_ROUTER_THRESHOLD:-0.6}
      CHATBOT_GRAPHRAG_TOP_K: ${CHATBOT_GRAPHRAG_TOP_K:-8}
      CHATBOT_GRAPHRAG_NEIGHBOURS: ${CHATBOT_GRAPHRAG_NEIGHBOURS:-16}
      CHATBOT_CYPHER_ROW_LIMIT: ${CHATBOT_CYPHER_ROW_LIMIT:-100}
      CHATBOT_MAX_CONTEXT_CHARS: ${CHATBOT_MAX_CONTEXT_CHARS:-12000}
      CHATBOT_INTROSPECT_SCHEMA: ${CHATBOT_INTROSPECT_SCHEMA:-true}
      CHATBOT_PLANNER_MAX_ROUNDS: ${CHATBOT_PLANNER_MAX_ROUNDS:-3}
      CHATBOT_PLANNER_MAX_TOOL_CALLS: ${CHATBOT_PLANNER_MAX_TOOL_CALLS:-6}
      CHATBOT_PLANNER_MAX_ROWS_PER_TOOL: ${CHATBOT_PLANNER_MAX_ROWS_PER_TOOL:-20}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
    networks: [ingestion-network]
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  frontend:
    image: chatbot-frontend:latest
    container_name: chatbot-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["3000:3000"]
    volumes:
      - ./../../../frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ingestion-network]

networks:
  ingestion-network:
    external: true
