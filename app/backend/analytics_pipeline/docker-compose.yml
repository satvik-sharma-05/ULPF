# ============================================================================
# ANALYTICS BACKEND standalone stack.
#
# network_mode: host, same reasoning as chatbot_pipeline/docker-compose.yml -
# it needs to reach whatever Neo4j the ingestion pipeline is already running
# (the bundled sandbox container or an externally-hosted instance) via the
# host's own localhost/IP, with zero custom network wiring.
#
#   docker compose up -d
#   docker compose logs -f analytics-backend
#   docker compose down
# ============================================================================

services:
  analytics-backend:
    image: analytics-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics-backend
    restart: unless-stopped
    network_mode: host
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sandboxpassword}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      ANALYTICS_MIN_VOLUME: ${ANALYTICS_MIN_VOLUME:-20}
      ANALYTICS_TOP_N: ${ANALYTICS_TOP_N:-10}
      ANALYTICS_TIMESERIES_MAX_DAYS: ${ANALYTICS_TIMESERIES_MAX_DAYS:-90}
      ANALYTICS_TREND_WINDOW_DAYS: ${ANALYTICS_TREND_WINDOW_DAYS:-7}
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-30}
      ANALYTICS_API_CORS_ORIGINS: ${ANALYTICS_API_CORS_ORIGINS:-*}
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
