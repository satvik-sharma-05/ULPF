# ============================================================================
# INGESTION PIPELINE - PIPELINE 1 (realtime): DNIF -> Kafka -> Neo4j
#
#   producer : polls the real DNIF API, pushes raw logs to Kafka
#   consumer : reads Kafka, parses, embeds, writes the graph to Neo4j
#
# Kafka and Neo4j are expected to already exist on the network; this file does
# not run production copies of them. Scale the parse/write side out with:
#   docker compose up -d --scale consumer=3
#
# PIPELINE 2 (batch: logs -> parser -> Neo4j) is not a long-running service, so
# it has no entry here. Run it as a one-off command in the same image:
#   docker compose run --rm consumer python -m batch.run_pipeline --path /app/logs
#
# For local development when the real 10.101.x.x infra isn't reachable, the
# `sandbox` profile starts a local Kafka + Neo4j:
#   docker compose --profile sandbox up -d
# ============================================================================

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CHECKPOINT_FILE: /app/output/ingestion_checkpoint.json

services:
  # ==========================================================================
  # PRODUCER: DNIF API -> Kafka (raw-logs)
  # ==========================================================================
  producer:
    build:
      context: .
      dockerfile: Dockerfile
    # One image for every role and for the batch pipeline - Compose builds it
    # once and reuses it, and it is what `docker save`/`docker load` refer to
    # for offline transfer.
    image: log-ingestion-pipeline:latest
    container_name: log-ingestion-producer
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_ROLE: producer
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1.internal.example:9092,kafka-2.internal.example:9092,kafka-3.internal.example:9092}
      KAFKA_TOPIC_RAW_LOGS: ${KAFKA_TOPIC_RAW_LOGS:-raw-logs}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      DNIF_API_URL: ${DNIF_API_URL:-http://your-dnif-server:8080}
      DNIF_API_KEY: ${DNIF_API_KEY:-your-api-key}
      DNIF_TENANT: ${DNIF_TENANT:-default}
      DNIF_POLL_INTERVAL: ${DNIF_POLL_INTERVAL:-5}
      DNIF_BATCH_SIZE: ${DNIF_BATCH_SIZE:-100}
      DNIF_TIMEOUT: ${DNIF_TIMEOUT:-30}
      DNIF_REPLAY_PATH: ${DNIF_REPLAY_PATH:-/app/logs}
      ENABLE_KAFKA: ${ENABLE_KAFKA:-true}
      # The producer only fills Kafka; it never touches the graph.
      ENABLE_NEO4J: "false"
    volumes:
      - ./output/producer:/app/output
      - ./logs:/app/logs:ro
    networks: [ingestion-network]
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }

  # ==========================================================================
  # CONSUMER: Kafka (raw-logs) -> Parser -> Embeddings -> Neo4j
  # ==========================================================================
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: log-ingestion-pipeline:latest
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_ROLE: consumer
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1.internal.example:9092,kafka-2.internal.example:9092,kafka-3.internal.example:9092}
      KAFKA_TOPIC_RAW_LOGS: ${KAFKA_TOPIC_RAW_LOGS:-raw-logs}
      KAFKA_TOPIC_PARSED_LOGS: ${KAFKA_TOPIC_PARSED_LOGS:-parsed-logs}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-log-ingestor-group}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j.internal.example:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_BATCH_SIZE: ${NEO4J_BATCH_SIZE:-500}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      ENABLE_KAFKA: ${ENABLE_KAFKA:-true}
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-true}
      ENABLE_NEO4J: ${ENABLE_NEO4J:-true}
    volumes:
      - ./output/consumer:/app/output
      # Mounted so `docker compose run consumer python -m batch.run_pipeline`
      # reaches the corpus without a second image or a rebuild.
      - ./logs:/app/logs:ro
    networks: [ingestion-network]
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }

  # ==========================================================================
  # OPTIONAL LOCAL SANDBOX - for development when the real infra is
  # unreachable. NOT part of the production topology.
  #   docker compose --profile sandbox up -d
  # ==========================================================================
  sandbox-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sandbox-zookeeper
    profiles: ["sandbox"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [ingestion-network]

  sandbox-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sandbox-kafka
    profiles: ["sandbox"]
    depends_on: [sandbox-zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: sandbox-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://sandbox-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - sandbox_kafka_data:/var/lib/kafka/data
    networks: [ingestion-network]

  sandbox-neo4j:
    image: neo4j:5-community
    container_name: sandbox-neo4j
    profiles: ["sandbox"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-sandboxpassword}
      # Overridable so this scales with whatever the host actually has - see
      # offline_ingest_structure.sh, which sets these from the VM's real RAM
      # instead of leaving the small defaults below (fine for a laptop demo,
      # not for a graph with 100M+ Log nodes plus hundreds of millions of
      # entity nodes and relationships).
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-4G}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-2G}
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - sandbox_neo4j_data:/data
    networks: [ingestion-network]

volumes:
  sandbox_kafka_data:
  sandbox_neo4j_data:

networks:
  ingestion-network:
    driver: bridge
    # Explicit name, not left to Compose's default (<project-dir>_ingestion-network):
    # the chatbot_pipeline stack is a SEPARATE `docker compose` project that needs
    # to join this exact network to reach sandbox-neo4j by service name. Without a
    # fixed name here, that target would depend on what folder this file happens to
    # sit in, which is fragile across the offline transfer this project already does.
    name: ingestion-network
